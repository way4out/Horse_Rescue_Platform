<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Designer Access — Ranch Land Animal Rescue</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f4ed;color:#10251b;font:16px/1.5 system-ui;padding:20px}.box{width:min(520px,100%);background:#fffdf8;border:1px solid #d8d0c0;border-radius:24px;padding:28px;box-shadow:0 18px 55px #10251b18}h1{margin:0 0 8px}p{color:#657067}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e4eee0;font-weight:900;font-size:.75rem;text-transform:uppercase}label{display:block;font-weight:800;font-size:.85rem;margin:14px 0 6px}input{width:100%;box-sizing:border-box;border:1px solid #d8d0c0;border-radius:12px;padding:12px;font:inherit}button,a{display:inline-block;border:0;border-radius:999px;padding:12px 17px;font-weight:900;text-decoration:none;cursor:pointer}button{background:#10251b;color:#fff;margin-top:16px;width:100%}a{background:#eee8da;color:#10251b;margin-top:10px;width:calc(100% - 34px);text-align:center}.msg{margin-top:14px;padding:12px;border-radius:12px;background:#eee8da;display:none}.ok{background:#e4eee0}.err{background:#f4dcd8}</style></head><body><main class="box"><span class="badge">Designer invitation</span><h1>Ranch Land Animal Rescue</h1><p>This is a secure one-time access link for the <strong>Designer</strong> role. Your invitation is validated by the rescue database and can only be claimed once.</p><form id="f"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="b">Sign in & claim Designer access</button></form><div id="m" class="msg"></div><a href="https://way4out.github.io/Ranch-Land-Animal-Rescue/">Return to rescue command center</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://iezlvnhztumznaldzzwz.supabase.co","sb_publishable_RAL1Wj7MSMXpipfqOZEO4g_cOPrcFzE");const token="a603729f128d4624bc21254bd5a055c275429b94818eda7c";const m=document.getElementById('m'),f=document.getElementById('f'),b=document.getElementById('b');function msg(t,c){m.textContent=t;m.className='msg '+(c||'');m.style.display='block'}f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg(error.message,'err');b.disabled=false;b.textContent='Sign in & claim Designer access';return}b.textContent='Claiming access…';const r=await sb.rpc('redeem_founder_invite',{p_token:token});if(r.error){msg(r.error.message,'err');b.disabled=false;b.textContent='Sign in & claim Designer access';return}msg('Access claimed successfully as Designer. You can now return to the rescue command center and use the staff workspace.','ok');setTimeout(()=>location.href="https://way4out.github.io/Ranch-Land-Animal-Rescue/?staff=1",1200)});</script></body></html>
